name: Release bootstrap

# The binary (@beraliv/bootstrap-darwin-arm64) is versioned by packages/bootstrap/package.json and tagged bootstrap-v<version>.
# The launcher (@beraliv/bootstrap) has its own version in npm/bootstrap/package.json and is published when that version is new.
# A merge to main publishes whichever version is new; pushing a bootstrap-v* tag by hand also releases that version.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/bootstrap/package.json'
      - 'packages/bootstrap/npm/**'
      - '.github/workflows/release-bootstrap.yml'
    tags:
      - 'bootstrap-v*'

permissions:
  contents: write
  id-token: write

jobs:
  # Tags pushed with GITHUB_TOKEN do not start other workflows, so the release runs in this workflow.
  tag:
    name: Create tag from version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag if this binary version is not tagged yet
        id: tag
        run: |
          version=$(node -p "require('./packages/bootstrap/package.json').version")
          tag="bootstrap-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists, nothing new to tag"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' && (startsWith(github.ref, 'refs/tags/') || needs.tag.outputs.tag != '') }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup bun (build only)
        uses: oven-sh/setup-bun@v2

      - name: Upgrade npm (trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@11 && npm -v

      - name: Set version from tag
        working-directory: packages/bootstrap
        # build.ts copies this version to the npm packages; the CLI reads it at compile time.
        run: npm version "${TAG#bootstrap-v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --filter bootstrap...

      - name: Type check and unit tests
        run: |
          pnpm --filter bootstrap run type
          pnpm --filter bootstrap run test:unit

      - name: Build binary
        working-directory: packages/bootstrap
        run: pnpm run build

      - name: Smoke test
        working-directory: packages/bootstrap
        run: |
          test "$(./dist/bootstrap-darwin-arm64 --version)" = "${TAG#bootstrap-v}"
          ./dist/bootstrap-darwin-arm64 --help

      # Publishes with OIDC trusted publishing (id-token: write), so no npm token is needed.
      # Skips a package whose version is already on npm, so re-running a tag does not fail.
      - name: Publish binary package
        working-directory: packages/bootstrap/npm/darwin-arm64
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish launcher package
        working-directory: packages/bootstrap/npm/bootstrap
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || needs.tag.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            packages/bootstrap/dist/bootstrap-darwin-arm64 \
            packages/bootstrap/dist/install.sh \
            --title "$TAG" --generate-notes --latest
